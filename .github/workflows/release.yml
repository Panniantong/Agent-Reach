name: release

# Push a tag like v1.6.0 to publish. Users install from the tagged archive,
# so a release is only created after the tests pass and the tag matches the
# version in pyproject.toml and agent_reach/__init__.py.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tag must match the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          py=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          init=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('agent_reach/__init__.py').read()).group(1))")
          echo "tag=$tag pyproject=$py __init__=$init"
          test "$tag" = "$py" && test "$tag" = "$init"

      - name: Test
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e ".[dev]"
          pytest -q

      - name: Require real channel acceptance for this source
        run: python scripts/check_release_acceptance.py

      - name: Build and smoke-install the wheel
        run: |
          python -m pip install build
          python -m build
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/agent-reach version
          /tmp/smoke/bin/agent-reach channels > /dev/null
          # Fixed name so docs can always point at
          # releases/latest/download/agent-reach.zip instead of a version number.
          git archive --format=zip --prefix=agent-reach/ -o dist/agent-reach.zip HEAD
          python -m venv /tmp/smoke-zip
          /tmp/smoke-zip/bin/pip install --quiet dist/agent-reach.zip
          /tmp/smoke-zip/bin/agent-reach version

      - name: Release notes from CHANGELOG
        run: |
          python - <<'PY'
          import os, re
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## \[{re.escape(version)}\].*?$(.*?)(?=^## \[|\Z)", text, re.M | re.S)
          if not m:
              raise SystemExit(f"CHANGELOG.md has no section for {version}")
          open("notes.md", "w", encoding="utf-8").write(m.group(1).strip() + "\n")
          PY

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
